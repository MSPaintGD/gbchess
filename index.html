<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GB Chess</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#game{width:100%;height:100%}
.ejs_menu_bar,.ejs_menu_bar_hidden,.ejs_menu_button{display:none!important}
</style>
</head><body>
<div id="game"></div>
<script>
window.EJS_player="#game";
window.EJS_core="gb";
window.EJS_gameName="chess";
window.EJS_gameUrl="chess.gb";
window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
window.EJS_startOnLoaded=true;
window.EJS_color="#000000";
window.EJS_Buttons={playPause:false,restart:false,mute:false,settings:false,fullscreen:false,saveState:false,loadState:false,screenRecord:false,gamepad:false,cheat:false,volume:false,saveSavFiles:false,loadSavFiles:false,quickSave:false,quickLoad:false,screenshot:false,cacheManager:false,exitEmulation:false,netplay:false,diskButton:false,contextMenuButton:false};
// hide the Fast / Slow buttons if they show up
new MutationObserver(function(){
  document.querySelectorAll("#game button,#game div,#game a").forEach(function(e){
    var t=(e.textContent||"").trim();
    if((t==="Fast"||t==="Slow")&&e.children.length===0){e.style.display="none";}
  });
}).observe(document.documentElement,{childList:true,subtree:true});
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body></html>
